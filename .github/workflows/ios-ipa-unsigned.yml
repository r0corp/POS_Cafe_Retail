name: iOS IPA tanpa tanda tangan (Oru POS GO)

# Membangun app iPhone TANPA akun Apple berbayar: hasilnya .ipa yang belum ditandatangani.
# File ini tidak bisa dipasang langsung; harus ditandatangani ulang oleh pemakai dengan
# Apple ID gratis lewat AltStore / Sideloadly (berlaku 7 hari, lalu diperpanjang). Cara
# lengkap: ios-app-umkm/INSTALL-IPHONE.md. Untuk pemasangan resmi (TestFlight/App Store)
# pakai workflow "iOS TestFlight" dan akun Apple Developer.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang Briefcase, salin kode GO, buat proyek Xcode
        working-directory: ios-app-umkm
        run: |
          python -m pip install --upgrade pip briefcase
          python sync_go.py
          briefcase create iOS --no-input

      - name: Compile untuk perangkat (tanpa tanda tangan)
        working-directory: ios-app-umkm
        run: |
          set -o pipefail
          PROJ=$(find build -name "*.xcodeproj" -maxdepth 6 | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&NF{print $1" "$2" "$3; exit}' | sed 's/ *$//')
          echo "Proyek: $PROJ  Scheme: $SCHEME"
          xcodebuild archive -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/orupos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log" | tail -25

      - name: Bungkus jadi .ipa
        run: |
          APP=$(find "$RUNNER_TEMP/orupos.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/oru-go-ios-unsigned.ipa" Payload)
          ls -l oru-go-ios-unsigned.ipa
          EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          {
            echo "## IPA tanpa tanda tangan"
            echo "- Ukuran: $(du -h oru-go-ios-unsigned.ipa | cut -f1)"
            echo "- Arsitektur: $(lipo -info "$APP/$EXE" 2>&1)"
            echo "- Versi: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
            echo "- Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: oru-go-ios-unsigned
          path: |
            oru-go-ios-unsigned.ipa
            xcodebuild.log

      - name: Terbitkan sebagai GitHub Release (ios-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-latest oru-go-ios-unsigned.ipa \
            --title "Oru POS GO untuk iPhone (uji coba, belum ditandatangani)" \
            --notes "Build otomatis dari commit ${{ github.sha }}. File .ipa ini TIDAK bisa dipasang langsung di iPhone: perlu ditandatangani ulang dengan Apple ID gratis lewat AltStore atau Sideloadly. Langkah lengkap: ios-app-umkm/INSTALL-IPHONE.md" \
            --prerelease
