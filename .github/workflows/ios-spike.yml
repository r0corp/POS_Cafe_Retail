name: iOS spike (Oru POS GO)

# Uji coba MANUAL: Actions > "iOS spike (Oru POS GO)" > Run workflow.
# Membangun GO untuk simulator iPhone, menjalankannya, lalu memeriksa apakah
# server Flask di dalam app hidup dan halaman login tampil. Hasil (tangkapan
# layar + log) ada di Artifacts. Repo publik: menit Actions gratis. Kalau repo
# jadi private, runner macOS dihitung 10x menit (lihat ios-app-umkm/README.md).
# Satu proses sekitar 15-30 menit.
on:
  workflow_dispatch:

# contents: write - hanya untuk mengunggah tangkapan layar + log ke branch
# ios-spike-results (supaya bisa dilihat tanpa login).
permissions:
  contents: write

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang Briefcase
        run: python -m pip install --upgrade pip briefcase

      - name: Salin kode GO
        run: python ios-app-umkm/sync_go.py

      - name: Briefcase create (proyek Xcode + paket Python untuk iOS)
        working-directory: ios-app-umkm
        run: |
          set -o pipefail
          briefcase create iOS --no-input 2>&1 | tee "$GITHUB_WORKSPACE/create.log"

      - name: Briefcase build (compile untuk simulator)
        working-directory: ios-app-umkm
        run: |
          set -o pipefail
          briefcase build iOS --no-input 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Jalankan di simulator dan periksa
        id: smoke
        working-directory: ios-app-umkm
        run: |
          set +e
          UDID=$(python ci_pick_simulator.py)
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" id.orulabs.orupos
          OK=no
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8731/login -o "$GITHUB_WORKSPACE/login.html"; then OK=yes; break; fi
            sleep 2
          done
          sleep 15
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/ios-login.png"
          # alur kasir lengkap terhadap server di dalam app (login, menu, pesanan, bayar, laporan, dll.)
          SMOKE=skipped
          if [ "$OK" = yes ]; then
            python ci_smoke.py --ios > "$GITHUB_WORKSPACE/smoke.log" 2>&1 && SMOKE=pass || SMOKE=fail
            cp smoke-result.json "$GITHUB_WORKSPACE/smoke-result.json" 2>/dev/null
          fi
          DATA=$(xcrun simctl get_app_container "$UDID" id.orulabs.orupos data)
          find "$DATA" -name "server_error.txt" -exec cp {} "$GITHUB_WORKSPACE/server_error.txt" \;
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "Oru POS GO"' > "$GITHUB_WORKSPACE/app-log.txt" 2>&1
          {
            echo "## Hasil uji iOS"
            echo "- Server Flask di dalam app menjawab /login: **$OK**"
            [ -f "$GITHUB_WORKSPACE/server_error.txt" ] && echo "- Ada server_error.txt (lihat artifact)"
            echo "- Ukuran login.html: $(wc -c < "$GITHUB_WORKSPACE/login.html" 2>/dev/null || echo 0) byte"
            echo "- Uji alur kasir: **$SMOKE**"
            echo ""
            echo '```'
            cat "$GITHUB_WORKSPACE/smoke.log" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$OK" = yes ] && [ "$SMOKE" = pass ]

      - name: Unggah hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-spike-hasil
          if-no-files-found: ignore
          path: |
            create.log
            build.log
            login.html
            smoke.log
            smoke-result.json
            ios-login.png
            server_error.txt
            app-log.txt

      - name: Publikasikan hasil ke branch ios-spike-results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/res"
          for f in ios-login.png smoke.log smoke-result.json server_error.txt; do cp "$f" "$RUNNER_TEMP/res/" 2>/dev/null || true; done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ios-spike-results
          git rm -rf -q . || true
          git clean -fdxq
          cp "$RUNNER_TEMP"/res/* . 2>/dev/null || true
          echo "Hasil uji iOS - run ${{ github.run_id }} (commit ${{ github.sha }})" > RUN.txt
          git add -A
          git commit -q -m "Hasil uji iOS run ${{ github.run_id }}" || true
          git push -f origin ios-spike-results
