plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Kunci tanda tangan rilis dibaca dari keystore.properties (di-gitignore,
// jangan pernah di-commit). Tanpa file ini build rilis tetap jalan tapi
// TIDAK ditandatangani - dan APK seperti itu tidak bisa dipasang/diupdate.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

// Edisi produk: GO (bawaan) atau Cafe. Bangun Cafe dengan:  ./gradlew.bat assembleRelease -Pedition=cafe
// (hasilnya di app/build-cafe/, terpisah dari GO). Cafe punya applicationId sendiri sehingga bisa terpasang
// berdampingan dengan GO, dan kodenya terikat edisi (lihat edition.py dan licensing.py).
def edition = (project.findProperty("edition") ?: "go").toString()
if (!["go", "cafe"].contains(edition)) {
    throw new GradleException("edition harus go atau cafe, bukan '${edition}'")
}
if (edition == "cafe") {
    buildDir = "build-cafe"
}

// Alamat manifest update (version.json) di repo rilis publik. Build debug
// (emulator) membaca dari PC pengembang lewat 10.0.2.2 supaya alur update
// bisa dites tanpa menerbitkan apa pun.
def releaseManifestUrl = edition == "cafe"
        ? "https://raw.githubusercontent.com/r0corp/oru-go-releases/main/cafe/version.json"
        : "https://raw.githubusercontent.com/r0corp/oru-go-releases/main/version.json"

android {
    namespace 'id.orulabs.umkm'
    compileSdk 34

    defaultConfig {
        applicationId edition == "cafe" ? "id.orulabs.pos.cafe" : "id.orulabs.umkm"
        manifestPlaceholders = [appLabel: edition == "cafe" ? "Oru POS Cafe" : "Oru POS GO"]
        buildConfigField "String", "EDITION", "\"${edition}\"" 
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.0.9"

        // Cuma ARM (HP asli) - x86/x86_64 cuma perlu buat emulator, dan
        // kita tidak punya emulator buat testing, jadi tidak usah
        // diikutkan (APK jadi lebih kecil & build lebih cepat).
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${releaseManifestUrl}\""
        }
        debug {
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"http://10.0.2.2:8765/version.json\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Purwarupa (proof-of-concept) tahap 1: cuma Flask polos buat pastikan
// mekanisme "Python jalan di dalam HP lewat Chaquopy, WebView buka
// localhost" ini benar-benar berfungsi di device asli, SEBELUM kode
// aplikasi POS yang sesungguhnya (app/) ditanam ke sini.
chaquopy {
    defaultConfig {
        // "app" (kode POS yang ditanam) taruh file APA ADANYA di disk
        // (bukan cuma di-zip) - dia punya static/template/data file
        // (CSS, foto, .mo, dst) yang dibaca lewat path filesystem biasa
        // (Jinja FileSystemLoader, open(), shutil.copytree), bukan
        // lewat mekanisme import Python - itu tidak akan pernah
        // ke-extract kalau cuma di-zip.
        extractPackages "app"

        pip {
            // Versi dikunci di requirements-go.txt (lihat komentar di sana) supaya
            // build di waktu berbeda menghasilkan APK dengan paket yang sama.
            install "-r", "requirements-go.txt"
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
