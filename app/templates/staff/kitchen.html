{% extends "base.html" %}
{% block title %}{{ _('Dapur') }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-1">
  <h4 class="mb-0"><i class="bi bi-egg-fried"></i> {{ _('Antrian Dapur') }}</h4>
  <button type="button" id="muteToggleKitchen" class="sound-toggle-btn">
    <i id="muteIconKitchen" class="bi bi-volume-up-fill"></i>
  </button>
</div>
<p class="text-muted small mb-3">{{ _('Pesanan yang perlu diproses, urut dari yang paling lama menunggu.') }}</p>

<div id="kitchenOrdersContainer">
  {% include "staff/_kitchen_orders.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
  // Poller-nya sudah global di base.html (window.globalKitchenPoller) -
  // supaya tetap bunyi walau staf sedang di halaman lain. Di sini cukup
  // daftarkan fungsi refresh daftar (dipanggil poller lewat
  // window.refreshKitchenList kalau halaman ini yang sedang dibuka) dan
  // pasang tombol mute ke poller global tsb.
  function refreshKitchenList() {
    fetch("{{ url_for('staff.kitchen_list') }}")
      .then(function (res) { return res.text(); })
      .then(function (html) {
        document.getElementById("kitchenOrdersContainer").innerHTML = html;
      })
      .catch(function () {});
  }
  window.refreshKitchenList = refreshKitchenList;

  if (window.globalKitchenPoller) {
    wireMuteToggle("muteToggleKitchen", "muteIconKitchen", window.globalKitchenPoller);
  }
</script>
{% endblock %}
