plugins {
    id 'com.android.application'
}

android {
    namespace 'id.cafepos.retail'
    compileSdk 34

    defaultConfig {
        applicationId "id.cafepos.retail"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // "prod" = APK toko asli (arah ke mini PC toko, lihat main/res).
    // "dev" = APK testing khusus, arah ke laptop dev lewat Tailscale
    // (lihat src/dev/res) - applicationId beda supaya bisa dipasang
    // berdampingan dengan APK toko di HP yang sama tanpa bentrok.
    flavorDimensions "environment"
    productFlavors {
        prod {
            dimension "environment"
        }
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // androidx.appcompat & swiperefreshlayout menarik kotlin-stdlib-jdk7/jdk8
    // versi lama secara transitif, padahal isinya sudah digabung ke dalam
    // kotlin-stdlib itu sendiri sejak Kotlin 1.8 - exclude biar tidak
    // bentrok class duplikat saat build.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
