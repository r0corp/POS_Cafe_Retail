<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg: #0B1220;
    --blue: #1BA0F8;
    --accent: #F07828;
    --text: #E8EEF5;
    --muted: #8CA0B8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
  }
  .offline-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px;
    text-align: center;
  }
  .logo-float {
    width: 96px;
    height: 96px;
    object-fit: contain;
    animation: floatY 2.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .signal-bars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
    height: 20px;
    margin-top: 18px;
  }
  .signal-bars span {
    display: block;
    width: 5px;
    border-radius: 3px;
    background: var(--blue);
    animation: barBounce 1.1s ease-in-out infinite;
  }
  .signal-bars span:nth-child(1) { animation-delay: 0s; }
  .signal-bars span:nth-child(2) { animation-delay: 0.15s; }
  .signal-bars span:nth-child(3) { animation-delay: 0.30s; }
  .signal-bars span:nth-child(4) { animation-delay: 0.15s; }
  .signal-bars span:nth-child(5) { animation-delay: 0s; }
  @keyframes barBounce {
    0%, 100% { height: 5px; }
    50% { height: 20px; }
  }
  .offline-title {
    margin-top: 22px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .offline-message {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    max-width: 280px;
    line-height: 1.5;
  }
  .error-code {
    display: none;
    margin-top: 16px;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="offline-wrap">
    <img class="logo-float" src="offline_logo.png" alt="Orulabs">
    <div class="signal-bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="offline-title" id="offlineTitle">Mencari Server Toko&hellip;</div>
    <div class="offline-message" id="offlineMessage">
      Tidak bisa terhubung ke server toko. Pastikan HP/tablet terhubung ke WiFi toko, lalu coba lagi.
    </div>
    <div class="error-code" id="errorCode"></div>
  </div>

  <script>
    // Dipanggil dari MainActivity.java (WebView.evaluateJavascript) setiap
    // kali ada error baru - dipakai bareng buat semua jenis error (offline
    // asli maupun error HTTP dari server seperti 404/500) supaya animasinya
    // sama, cuma kode & pesannya yang beda.
    function setErrorCode(code) {
      var codeEl = document.getElementById("errorCode");
      var titleEl = document.getElementById("offlineTitle");
      var messageEl = document.getElementById("offlineMessage");
      if (!codeEl) return;

      if (code) {
        codeEl.textContent = code;
        codeEl.style.display = "block";
        titleEl.textContent = "Terjadi Kendala";
        messageEl.textContent = "Server toko mengalami gangguan (kode " + code + "). Coba lagi dalam beberapa saat.";
      } else {
        codeEl.style.display = "none";
        titleEl.textContent = "Mencari Server Toko…";
        messageEl.textContent = "Tidak bisa terhubung ke server toko. Pastikan HP/tablet terhubung ke WiFi toko, lalu coba lagi.";
      }
    }

    // Kalau halaman ini dimuat langsung dengan ?code=404 di URL-nya
    // (bukan lewat evaluateJavascript), tetap kebaca dari sini.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      if (code) setErrorCode(code);
    })();
  </script>
</body>
</html>
