<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orulabs POS - Kontrol Deploy</title>
<style>
  :root {
    --bg: #0B1220;
    --card: #131C2E;
    --card-border: #1F2A3D;
    --text: #E7ECF3;
    --muted: #8A96A8;
    --accent: #F07828;
    --accent-dark: #D9601A;
    --primary: #1BA0F8;
    --ok: #2ECC71;
    --danger: #FF5C5C;
    --warn: #FFC94D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .agent-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .agent-name {
    font-weight: 700;
    font-size: 16px;
  }
  .agent-host {
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-ok { background: rgba(46,204,113,0.15); color: var(--ok); }
  .badge-warn { background: rgba(255,201,77,0.15); color: var(--warn); }
  .badge-danger { background: rgba(255,92,92,0.15); color: var(--danger); }
  .badge-muted { background: rgba(138,150,168,0.15); color: var(--muted); }
  .commit-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    padding: 8px 0;
    border-top: 1px solid var(--card-border);
  }
  .commit-row:first-of-type { border-top: none; }
  .commit-label { color: var(--muted); min-width: 70px; }
  .commit-msg { text-align: right; }
  .commit-hash { color: var(--muted); font-family: monospace; font-size: 11px; }
  .pending-list {
    margin-top: 10px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 12px;
  }
  .pending-item {
    padding: 6px 0;
    border-top: 1px solid var(--card-border);
  }
  .pending-item:first-child { border-top: none; }
  .pending-hash { color: var(--muted); font-family: monospace; font-size: 11px; }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .btn-danger { background: rgba(255,92,92,0.15); color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .log-box {
    margin-top: 12px;
    background: #0A0F1A;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .add-form input {
    background: #0A0F1A;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .add-form .full { grid-column: 1 / -1; }
  .discover-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .discover-item:hover { background: rgba(255,255,255,0.09); }
  .discover-item-ip { color: var(--muted); font-family: monospace; font-size: 12px; }
  .discover-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .discover-dot-on { background: var(--ok); }
  .discover-dot-off { background: var(--muted); }
  .rollback-panel {
    max-height: 260px;
    overflow-y: auto;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--card-border);
  }
  .rollback-item { cursor: pointer; }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  .top-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 16px;
  }
  .checked-at {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Orulabs POS &middot; Kontrol Deploy</h1>
  <p class="subtitle">Pantau versi kode yang jalan di tiap instalasi POS, dan update dari jarak jauh lewat Tailscale.</p>

  <div class="card" id="addCard">
    <div class="agent-header" style="margin-bottom: 12px;">
      <div class="agent-name">+ Tambah Mini PC</div>
      <button class="btn-secondary" onclick="discoverDevices()" id="discoverBtn">&#x1F50D; Cari Device di Tailscale</button>
    </div>
    <div id="discoverResults"></div>
    <div class="add-form">
      <input type="text" id="newName" placeholder="Nama (mis. Cafe Cakung)">
      <input type="text" id="newHost" placeholder="IP Tailscale (mis. 100.92.108.118)">
      <input type="text" id="newPort" placeholder="Port (default 8787)">
      <input type="text" id="newToken" placeholder="Token (dari ops/.env di mini PC itu)">
    </div>
    <button class="btn-primary" onclick="addAgent()">Tambah</button>
  </div>

  <div class="top-actions">
    <button class="btn-secondary" onclick="refreshAll()">&#x21bb; Refresh Semua</button>
  </div>

  <div id="agentList"></div>
  <div id="emptyState" class="empty-state" style="display:none;">Belum ada mini PC terdaftar - tambahkan lewat form di atas.</div>
</div>

<script>
const STORAGE_KEY = "orulabs_ops_agents";

function loadAgents() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function saveAgents(agents) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(agents));
  } catch (e) {}
}

async function discoverDevices() {
  const btn = document.getElementById("discoverBtn");
  const resultsEl = document.getElementById("discoverResults");
  btn.disabled = true;
  btn.textContent = "Mencari...";
  resultsEl.innerHTML = `<div class="empty-state">Mencari device di tailnet...</div>`;

  try {
    // Dashboard ini sendiri dilayani oleh ops/dashboard_server.py di
    // localhost:8790 - endpoint /api/tailscale-devices ikut nempel di
    // situ. Kalau dashboard dibuka lewat file:// langsung (bukan lewat
    // server itu), fitur ini tidak akan jalan (dikasih tahu di pesan
    // error-nya).
    const res = await fetch("http://localhost:8790/api/tailscale-devices");
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const known = new Set(loadAgents().map(a => a.host));
    const candidates = data.devices.filter(d => !known.has(d.ip) && !d.is_self);

    if (!candidates.length) {
      resultsEl.innerHTML = `<div class="empty-state">Tidak ada device baru di tailnet (atau semuanya sudah terdaftar).</div>`;
    } else {
      resultsEl.innerHTML = candidates.map(d => `
        <div class="discover-item" data-name="${d.name}" data-ip="${d.ip}">
          <span><span class="discover-dot ${d.online ? 'discover-dot-on' : 'discover-dot-off'}"></span>${d.name} <span class="discover-item-ip">(${d.os})</span></span>
          <span class="discover-item-ip">${d.ip}</span>
        </div>
      `).join("");
      resultsEl.querySelectorAll(".discover-item").forEach(el => {
        el.addEventListener("click", () => {
          document.getElementById("newName").value = el.dataset.name;
          document.getElementById("newHost").value = el.dataset.ip;
          document.getElementById("newToken").focus();
        });
      });
    }
  } catch (e) {
    resultsEl.innerHTML = `<div class="empty-state">Gagal cari device: ${e.message}. (Fitur ini butuh dashboard dibuka lewat http://localhost:8790, bukan file lokal.)</div>`;
  }

  btn.disabled = false;
  btn.textContent = "\u{1F50D} Cari Device di Tailscale";
}

function addAgent() {
  const name = document.getElementById("newName").value.trim();
  const host = document.getElementById("newHost").value.trim();
  const port = document.getElementById("newPort").value.trim() || "8787";
  const token = document.getElementById("newToken").value.trim();

  if (!name || !host || !token) {
    alert("Isi nama, IP Tailscale, dan token dulu.");
    return;
  }

  const agents = loadAgents();
  agents.push({ id: Date.now().toString(36), name, host, port, token });
  saveAgents(agents);

  document.getElementById("newName").value = "";
  document.getElementById("newHost").value = "";
  document.getElementById("newPort").value = "";
  document.getElementById("newToken").value = "";

  render();
}

function removeAgent(id) {
  if (!confirm("Hapus mini PC ini dari daftar? (Tidak menghapus/mematikan agent di mini PC-nya, cuma dari daftar di dashboard ini.)")) return;
  saveAgents(loadAgents().filter(a => a.id !== id));
  render();
}

function agentUrl(agent, path) {
  return `http://${agent.host}:${agent.port}${path}`;
}

function fmtDate(iso) {
  if (!iso || iso === "?") return "-";
  // git --format=%ci menghasilkan "2026-09-24 12:01:44 +0700" - offset
  // zona waktunya tanpa titik dua ("+0700"), yang bikin `new Date()`
  // browser gagal parse (Invalid Date). Susun ulang jadi ISO 8601 yang
  // benar ("+07:00") sebelum di-parse.
  const match = iso.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}) ([+-]\d{2})(\d{2})$/);
  if (match) {
    const [, date, time, tzHour, tzMinute] = match;
    const parsed = new Date(`${date}T${time}${tzHour}:${tzMinute}`);
    if (!isNaN(parsed)) return parsed.toLocaleString("id-ID");
  }
  return iso;
}

function shortHash(h) {
  return (h || "").slice(0, 7);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchStatus(agent, attempt = 1) {
  let res;
  try {
    res = await fetch(agentUrl(agent, "/status"), {
      headers: { "X-Agent-Token": agent.token },
    });
  } catch (e) {
    // Koneksi lewat Tailscale relay kadang butuh "pemanasan" di percobaan
    // pertama setelah idle (paket pertama drop sebelum jalur ketemu) -
    // coba ulang sebentar sebelum benar-benar dianggap offline.
    if (attempt < 3) {
      await sleep(1500);
      return fetchStatus(agent, attempt + 1);
    }
    throw new Error("Tidak bisa terhubung (cek Tailscale & agent-nya masih hidup).");
  }
  if (res.status === 401) throw new Error("Token salah/ditolak.");
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function triggerUpdate(agent, logEl, btnEl) {
  if (!confirm(`Update aplikasi POS di "${agent.name}" sekarang? Aplikasi akan restart sebentar (beberapa detik) selama proses ini.`)) return;

  btnEl.disabled = true;
  btnEl.textContent = "Memproses...";
  logEl.style.display = "block";
  logEl.textContent = "Menjalankan update, mohon tunggu...";

  try {
    const res = await fetch(agentUrl(agent, "/update"), {
      method: "POST",
      headers: { "X-Agent-Token": agent.token },
    });
    const data = await res.json();
    if (!res.ok) {
      logEl.textContent = `Gagal: ${data.error || res.status}`;
    } else {
      logEl.textContent =
        (data.changed
          ? `Update selesai: ${shortHash(data.before)} -> ${shortHash(data.after)}`
          : `Sudah versi terbaru, tidak ada perubahan.`) +
        "\n\n" + data.log;
    }
  } catch (e) {
    logEl.textContent = `Gagal menghubungi agent: ${e.message}`;
  }

  btnEl.disabled = false;
  btnEl.textContent = "Update Sekarang";
  await refreshOne(agent.id);
}

async function toggleRollbackPanel(agent, card) {
  const panel = card.querySelector(".rollback-panel");

  if (panel.style.display !== "none") {
    panel.style.display = "none";
    return;
  }

  panel.style.display = "block";
  panel.innerHTML = `<div class="empty-state">Memuat riwayat commit...</div>`;

  try {
    const res = await fetch(agentUrl(agent, "/commits?limit=20"), {
      headers: { "X-Agent-Token": agent.token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    panel.innerHTML = data.commits.map(c => `
      <div class="discover-item rollback-item" data-hash="${c.hash}">
        <span>${c.hash === data.current ? '<span class="badge badge-ok" style="margin-right:6px;">Aktif</span>' : ''}${c.message}<br><span class="discover-item-ip">${shortHash(c.hash)} &middot; ${fmtDate(c.date)}</span></span>
      </div>
    `).join("");

    panel.querySelectorAll(".rollback-item").forEach(el => {
      if (el.dataset.hash === data.current) return; // sudah di sini, tidak perlu rollback ke diri sendiri
      el.addEventListener("click", () => {
        const logEl = card.querySelector(".log-box");
        const btnEl = card.querySelector(".rollback-toggle-btn");
        triggerRollback(agent, el.dataset.hash, logEl, btnEl, panel);
      });
    });
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">Gagal ambil riwayat commit: ${e.message}</div>`;
  }
}

async function triggerRollback(agent, commitHash, logEl, btnEl, panel) {
  if (!confirm(`Rollback aplikasi POS di "${agent.name}" ke commit ${shortHash(commitHash)}? Aplikasi akan restart sebentar, dan versi setelah commit ini akan DITINGGALKAN sampai Anda update lagi nanti.`)) return;

  panel.style.display = "none";
  btnEl.disabled = true;
  logEl.style.display = "block";
  logEl.textContent = "Menjalankan rollback, mohon tunggu...";

  try {
    const res = await fetch(agentUrl(agent, "/rollback"), {
      method: "POST",
      headers: { "X-Agent-Token": agent.token, "Content-Type": "application/json" },
      body: JSON.stringify({ commit: commitHash }),
    });
    const data = await res.json();
    if (!res.ok) {
      logEl.textContent = `Gagal: ${data.error || res.status}`;
    } else {
      logEl.textContent = `Rollback selesai: ${shortHash(data.before)} -> ${shortHash(data.after)}\n\n${data.log}`;
    }
  } catch (e) {
    logEl.textContent = `Gagal menghubungi agent: ${e.message}`;
  }

  btnEl.disabled = false;
  await refreshOne(agent.id);
}

function statusBadge(cardEl, state) {
  const badge = cardEl && cardEl.querySelector(".status-badge");
  if (!badge) return;
  if (state === "loading") {
    badge.className = "badge badge-muted";
    badge.textContent = "Mengecek...";
  } else if (state === "offline") {
    badge.className = "badge badge-danger";
    badge.textContent = "Tidak terhubung";
  } else if (state === "uptodate") {
    badge.className = "badge badge-ok";
    badge.textContent = "Sudah terbaru";
  } else if (state === "outdated") {
    badge.className = "badge badge-warn";
    badge.textContent = "Ada update";
  }
}

function renderAgentCard(agent) {
  const card = document.createElement("div");
  card.className = "card";
  card.id = `agent-${agent.id}`;
  card.innerHTML = `
    <div class="agent-header">
      <div>
        <div class="agent-name">${agent.name}</div>
        <div class="agent-host">${agent.host}:${agent.port}</div>
      </div>
      <span class="badge badge-muted status-badge">Mengecek...</span>
    </div>
    <div class="commit-body">
      <div class="empty-state">Memuat status...</div>
    </div>
    <div class="actions">
      <button class="btn-primary update-btn">Update Sekarang</button>
      <button class="btn-secondary rollback-toggle-btn">Rollback</button>
      <button class="btn-secondary refresh-btn">Refresh</button>
      <button class="btn-danger remove-btn">Hapus</button>
    </div>
    <div class="rollback-panel" style="display:none;"></div>
    <div class="log-box"></div>
  `;

  card.querySelector(".remove-btn").addEventListener("click", () => removeAgent(agent.id));
  card.querySelector(".refresh-btn").addEventListener("click", () => refreshOne(agent.id));
  card.querySelector(".update-btn").addEventListener("click", () => {
    const logEl = card.querySelector(".log-box");
    const btnEl = card.querySelector(".update-btn");
    triggerUpdate(agent, logEl, btnEl);
  });
  card.querySelector(".rollback-toggle-btn").addEventListener("click", () => {
    toggleRollbackPanel(agent, card);
  });

  return card;
}

async function refreshOne(agentId) {
  const agents = loadAgents();
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;

  const card = document.getElementById(`agent-${agent.id}`);
  if (!card) return;

  statusBadge(card, "loading");
  const body = card.querySelector(".commit-body");

  try {
    const data = await fetchStatus(agent);
    statusBadge(card, data.up_to_date ? "uptodate" : "outdated");

    let pendingHtml = "";
    if (data.pending_commits && data.pending_commits.length) {
      pendingHtml = `<div class="pending-list">` +
        data.pending_commits.map(c => `
          <div class="pending-item">
            <span class="pending-hash">${shortHash(c.hash)}</span> - ${c.message}
          </div>
        `).join("") +
        `</div>`;
    }

    body.innerHTML = `
      <div class="commit-row">
        <span class="commit-label">Jalan</span>
        <span class="commit-msg">${data.current.message}<br><span class="commit-hash">${shortHash(data.current.hash)} &middot; ${fmtDate(data.current.date)}</span></span>
      </div>
      <div class="commit-row">
        <span class="commit-label">Terbaru</span>
        <span class="commit-msg">${data.latest.message}<br><span class="commit-hash">${shortHash(data.latest.hash)} &middot; ${fmtDate(data.latest.date)}</span></span>
      </div>
      <div class="commit-row">
        <span class="commit-label">Service</span>
        <span class="commit-msg">${data.service_status || "-"}</span>
      </div>
      ${pendingHtml}
      <div class="checked-at">Dicek: ${fmtDate(data.checked_at)}</div>
    `;
  } catch (e) {
    statusBadge(card, "offline");
    body.innerHTML = `<div class="empty-state">${e.message}</div>`;
  }
}

function refreshAll() {
  loadAgents().forEach(a => refreshOne(a.id));
}

function render() {
  const agents = loadAgents();
  const list = document.getElementById("agentList");
  const empty = document.getElementById("emptyState");
  list.innerHTML = "";

  if (!agents.length) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  agents.forEach(agent => {
    list.appendChild(renderAgentCard(agent));
  });
  refreshAll();
}

render();
// Auto-refresh tiap 60 detik.
setInterval(refreshAll, 60000);
</script>
</body>
</html>
