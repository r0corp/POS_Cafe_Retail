<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orulabs POS - Kontrol Deploy</title>
<style>
  :root {
    --bg: #0B1220;
    --card: #131C2E;
    --card-border: #1F2A3D;
    --text: #E7ECF3;
    --muted: #8A96A8;
    --accent: #F07828;
    --accent-dark: #D9601A;
    --primary: #1BA0F8;
    --ok: #2ECC71;
    --danger: #FF5C5C;
    --warn: #FFC94D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .lang-switch {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .lang-flag-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px;
    border-radius: 5px;
    line-height: 1;
    cursor: pointer;
    border: none;
    background: transparent;
    opacity: 0.45;
    filter: grayscale(70%);
    transition: opacity 0.15s ease, filter 0.15s ease, background 0.15s ease;
  }
  .lang-flag-btn svg {
    width: 22px;
    height: 15px;
    border-radius: 2px;
    display: block;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
  }
  .lang-flag-btn:hover { opacity: 0.8; filter: grayscale(20%); }
  .lang-flag-btn.active {
    opacity: 1;
    filter: none;
    background: rgba(240,120,40,0.18);
  }
  #agentList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
    align-items: start;
  }
  #agentList .card { margin-bottom: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .agent-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .agent-name {
    font-weight: 700;
    font-size: 16px;
  }
  .agent-host {
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-ok { background: rgba(46,204,113,0.15); color: var(--ok); }
  .badge-warn { background: rgba(255,201,77,0.15); color: var(--warn); }
  .badge-danger { background: rgba(255,92,92,0.15); color: var(--danger); }
  .badge-muted { background: rgba(138,150,168,0.15); color: var(--muted); }
  .commit-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    padding: 8px 0;
    border-top: 1px solid var(--card-border);
  }
  .commit-row:first-of-type { border-top: none; }
  .commit-label { color: var(--muted); min-width: 70px; }
  .commit-msg { text-align: right; }
  .commit-hash { color: var(--muted); font-family: monospace; font-size: 11px; }
  .pending-list {
    margin-top: 10px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 12px;
  }
  .pending-item {
    padding: 6px 0;
    border-top: 1px solid var(--card-border);
  }
  .pending-item:first-child { border-top: none; }
  .pending-hash { color: var(--muted); font-family: monospace; font-size: 11px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .action-groups {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
  }
  .action-group {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 10px 12px;
  }
  .action-group-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .action-group .actions {
    margin-top: 0;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .btn-danger { background: rgba(255,92,92,0.15); color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .log-box {
    margin-top: 12px;
    background: #0A0F1A;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .add-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .add-form input {
    background: #0A0F1A;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
  }
  .add-form .full { grid-column: 1 / -1; }
  .discover-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .discover-item:hover { background: rgba(255,255,255,0.09); }
  .discover-item-ip { color: var(--muted); font-family: monospace; font-size: 12px; }
  .discover-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .discover-dot-on { background: var(--ok); }
  .discover-dot-off { background: var(--muted); }
  .rollback-panel, .logs-panel, .backups-panel {
    max-height: 320px;
    overflow-y: auto;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--card-border);
  }
  .rollback-item { cursor: pointer; }
  .log-tail {
    background: #0A0F1A;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 8px;
  }
  .log-tail-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .backup-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 6px;
    font-size: 12px;
  }
  .backup-verify-btn {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    cursor: pointer;
  }
  .backup-verify-result { font-size: 11px; margin-top: 4px; }
  .backup-verify-ok { color: var(--ok); }
  .backup-verify-bad { color: var(--danger); }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
  .top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .device-count {
    color: var(--muted);
    font-size: 13px;
  }
  .add-toggle {
    cursor: pointer;
    user-select: none;
  }
  .add-toggle-icon {
    color: var(--muted);
    font-size: 13px;
    transition: transform 0.15s;
  }
  .add-toggle-icon.open { transform: rotate(90deg); }
  .add-form-body { margin-top: 14px; }
  .edit-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--card-border);
  }
  .edit-form input {
    background: #0A0F1A;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
  }
  .edit-form .full { grid-column: 1 / -1; }
  .edit-form-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .checked-at {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <div>
      <h1 data-i18n="title">Orulabs POS &middot; Kontrol Deploy</h1>
      <p class="subtitle" data-i18n="subtitle">Pantau versi kode yang jalan di tiap instalasi POS, dan update dari jarak jauh lewat Tailscale.</p>
    </div>
    <div class="lang-switch">
      <button type="button" class="lang-flag-btn" id="langBtnId" title="Bahasa Indonesia" onclick="setLang('id')">
        <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg"><rect width="3" height="1" fill="#e70011"/><rect width="3" height="1" y="1" fill="#fff"/></svg>
      </button>
      <button type="button" class="lang-flag-btn" id="langBtnEn" title="English" onclick="setLang('en')">
        <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
          <rect width="60" height="30" fill="#00247d"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="card" id="addCard">
    <div class="agent-header add-toggle" onclick="toggleAddForm()">
      <div class="agent-name" data-i18n="addMiniPc">+ Tambah Mini PC</div>
      <span class="add-toggle-icon" id="addToggleIcon">&#x25B8;</span>
    </div>
    <div class="add-form-body" id="addFormBody" style="display:none;">
      <div class="agent-header" style="margin-bottom: 12px;">
        <span class="agent-host" data-i18n="searchHint">Cari mini PC yang sudah terinstall (agent) tapi belum terdaftar di sini:</span>
        <button class="btn-secondary" onclick="discoverDevices()" id="discoverBtn" data-i18n="searchBtn">&#x1F50D; Cari Device di Tailscale</button>
      </div>
      <div id="discoverResults"></div>
      <div class="add-form">
        <input type="text" id="newName" data-i18n-placeholder="nameHolder" placeholder="Nama (mis. Cafe Cakung)">
        <input type="text" id="newHost" data-i18n-placeholder="hostHolder" placeholder="IP Tailscale (mis. 100.92.108.118)">
        <input type="text" id="newPort" data-i18n-placeholder="portHolder" placeholder="Port (default 8787)">
        <input type="text" id="newToken" data-i18n-placeholder="tokenHolder" placeholder="Token (dari ops/.env di mini PC itu)">
      </div>
      <button class="btn-primary" onclick="addAgent()" id="addAgentBtn" data-i18n="addBtn">Tambah</button>
    </div>
  </div>

  <div class="top-actions">
    <span class="device-count" id="deviceCount"></span>
    <div style="display:flex; gap:8px;">
      <button class="btn-secondary" onclick="refreshAll()" data-i18n="refreshAllBtn">&#x21bb; Refresh Semua</button>
      <form method="post" action="/logout" style="margin:0;">
        <button type="submit" class="btn-secondary" data-i18n="logoutBtn">Keluar</button>
      </form>
    </div>
  </div>

  <div id="agentList"></div>
  <div id="emptyState" class="empty-state" style="display:none;" data-i18n="emptyState">Belum ada mini PC terdaftar - tambahkan lewat form di atas.</div>
</div>

    fileOnlyWarning: "(This feature needs the dashboard opened via http://localhost:8790, not a local file.)",
  },
};

function getLang() {
  try {
    return localStorage.getItem("orulabs_dashboard_lang") || "id";
  } catch (e) {
    return "id";
  }
}

function t(key, ...args) {
  const dict = I18N[getLang()] || I18N.id;
  const entry = dict[key] !== undefined ? dict[key] : I18N.id[key];
  return typeof entry === "function" ? entry(...args) : entry;
}

function setLang(lang) {
  try {
    localStorage.setItem("orulabs_dashboard_lang", lang);
  } catch (e) {}
  applyStaticI18n();
  render();
}

function applyStaticI18n() {
  const lang = getLang();
  document.getElementById("langBtnId").classList.toggle("active", lang === "id");
  document.getElementById("langBtnEn").classList.toggle("active", lang === "en");
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
}

// Daftar mini PC disimpan di server (ops/dashboard_agents.json lewat
// dashboard_server.py), BUKAN localStorage browser - supaya "statis":
// selalu sama isinya mau dibuka dari browser/profile apa pun, dan tidak
// hilang kalau sebelumnya sempat dibuka lewat cara akses yang berbeda.
async function loadAgents() {
  try {
    const res = await fetch("/api/agents");
    if (!res.ok) return [];
    const data = await res.json();
    return data.agents || [];
  } catch (e) {
    return [];
  }
}

function toggleAddForm() {
  const body = document.getElementById("addFormBody");
  const icon = document.getElementById("addToggleIcon");
  const open = body.style.display !== "none";
  body.style.display = open ? "none" : "block";
  icon.classList.toggle("open", !open);
}

async function discoverDevices() {
  const btn = document.getElementById("discoverBtn");
  const resultsEl = document.getElementById("discoverResults");
  btn.disabled = true;
  btn.textContent = t("searching");
  resultsEl.innerHTML = `<div class="empty-state">${t("noDeviceSearchYet")}</div>`;

  try {
    // Endpoint ini dilayani oleh ops/dashboard_server.py yang sama yang
    // menyajikan halaman ini sendiri, jadi cukup path relatif. Kalau
    // dashboard dibuka lewat file:// langsung (bukan lewat server itu),
    // fitur ini tidak akan jalan (dikasih tahu di pesan error-nya).
    const res = await fetch("/api/tailscale-devices");
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const known = new Set((await loadAgents()).map(a => a.host));
    const candidates = data.devices.filter(d => !known.has(d.ip) && !d.is_self);

    if (!candidates.length) {
      resultsEl.innerHTML = `<div class="empty-state">${t("noNewDevices")}</div>`;
    } else {
      resultsEl.innerHTML = candidates.map(d => `
        <div class="discover-item" data-name="${d.name}" data-ip="${d.ip}">
          <span><span class="discover-dot ${d.online ? 'discover-dot-on' : 'discover-dot-off'}"></span>${d.name} <span class="discover-item-ip">(${d.os})</span></span>
          <span class="discover-item-ip">${d.ip}</span>
        </div>
      `).join("");
      resultsEl.querySelectorAll(".discover-item").forEach(el => {
        el.addEventListener("click", () => {
          document.getElementById("newName").value = el.dataset.name;
          document.getElementById("newHost").value = el.dataset.ip;
          document.getElementById("newToken").focus();
        });
      });
    }
  } catch (e) {
    resultsEl.innerHTML = `<div class="empty-state">${t("failDiscover", e.message)}</div>`;
  }

  btn.disabled = false;
  btn.textContent = t("searchBtn");
}

async function addAgent() {
  const name = document.getElementById("newName").value.trim();
  const host = document.getElementById("newHost").value.trim();
  const port = document.getElementById("newPort").value.trim() || "8787";
  const token = document.getElementById("newToken").value.trim();

  if (!name || !host || !token) {
    alert(t("fillNameHostToken"));
    return;
  }

  const btn = document.getElementById("addAgentBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/agents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, host, port, token }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || t("failAdd"));
      return;
    }

    document.getElementById("newName").value = "";
    document.getElementById("newHost").value = "";
    document.getElementById("newPort").value = "";
    document.getElementById("newToken").value = "";
    document.getElementById("discoverResults").innerHTML = "";

    await render();
  } finally {
    btn.disabled = false;
  }
}

async function removeAgent(id) {
  if (!confirm(t("confirmRemove"))) return;
  await fetch(`/api/agents/${id}`, { method: "DELETE" });
  await render();
}

async function saveEditedAgent(agent, card, panel) {
  const name = panel.querySelector(".edit-name").value.trim();
  const host = panel.querySelector(".edit-host").value.trim();
  const port = panel.querySelector(".edit-port").value.trim() || "8787";
  const token = panel.querySelector(".edit-token").value.trim();

  if (!name || !host || !token) {
    alert(t("fillNameHostToken"));
    return;
  }

  const res = await fetch(`/api/agents/${agent.id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, host, port, token }),
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || t("failSave"));
    return;
  }

  await render();
}

function toggleEditPanel(agent, card) {
  const panel = card.querySelector(".edit-panel");

  if (panel.style.display !== "none") {
    panel.style.display = "none";
    return;
  }

  panel.style.display = "block";
  panel.innerHTML = `
    <div class="edit-form">
      <input type="text" class="edit-name" value="${agent.name}" placeholder="Nama">
      <input type="text" class="edit-host" value="${agent.host}" placeholder="IP Tailscale">
      <input type="text" class="edit-port" value="${agent.port}" placeholder="Port">
      <input type="text" class="edit-token" value="${agent.token}" placeholder="Token">
      <div class="edit-form-actions">
        <button class="btn-primary edit-save-btn">${t("saveBtn")}</button>
        <button class="btn-secondary edit-cancel-btn">${t("cancelBtn")}</button>
      </div>
    </div>
  `;
  panel.querySelector(".edit-save-btn").addEventListener("click", () => saveEditedAgent(agent, card, panel));
  panel.querySelector(".edit-cancel-btn").addEventListener("click", () => { panel.style.display = "none"; });
}

function agentUrl(agent, path) {
  return `http://${agent.host}:${agent.port}${path}`;
}

function fmtDate(iso) {
  if (!iso || iso === "?") return "-";
  // git --format=%ci menghasilkan "2026-09-24 12:01:44 +0700" - offset
  // zona waktunya tanpa titik dua ("+0700"), yang bikin `new Date()`
  // browser gagal parse (Invalid Date). Susun ulang jadi ISO 8601 yang
  // benar ("+07:00") sebelum di-parse.
  const locale = getLang() === "en" ? "en-GB" : "id-ID";
  const match = iso.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2}) ([+-]\d{2})(\d{2})$/);
  if (match) {
    const [, date, time, tzHour, tzMinute] = match;
    const parsed = new Date(`${date}T${time}${tzHour}:${tzMinute}`);
    if (!isNaN(parsed)) return parsed.toLocaleString(locale);
  }
  // Format lain (mis. ISO 8601 "T..." dari Python datetime.isoformat(),
  // dipakai /backups) - biasanya sudah langsung bisa di-parse browser.
  const direct = new Date(iso);
  if (!isNaN(direct)) return direct.toLocaleString(locale);
  return iso;
}

function shortHash(h) {
  return (h || "").slice(0, 7);
}

function deployTimeWarning() {
  // Update/rollback me-restart aplikasi POS sebentar - pengingat jam
  // sekarang supaya tidak ke-klik tanpa sadar pas lagi jam ramai.
  // 10:00-21:00 dipakai sebagai perkiraan umum jam operasional café
  // (bukan jadwal pasti tiap cabang), jadi ini pengingat, bukan larangan.
  const locale = getLang() === "en" ? "en-GB" : "id-ID";
  const now = new Date();
  const timeStr = now.toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" });
  const hour = now.getHours();
  const likelyBusy = hour >= 10 && hour < 21;
  return likelyBusy ? t("busyWarning", timeStr) : t("timeNow", timeStr);
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchStatus(agent, attempt = 1) {
  let res;
  try {
    res = await fetch(agentUrl(agent, "/status"), {
      headers: { "X-Agent-Token": agent.token },
    });
  } catch (e) {
    // Koneksi lewat Tailscale relay kadang butuh "pemanasan" di percobaan
    // pertama setelah idle (paket pertama drop sebelum jalur ketemu) -
    // coba ulang sebentar sebelum benar-benar dianggap offline.
    if (attempt < 3) {
      await sleep(1500);
      return fetchStatus(agent, attempt + 1);
    }
    throw new Error(t("cannotConnect"));
  }
  if (res.status === 401) throw new Error(t("tokenWrong"));
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function triggerUpdate(agent, logEl, btnEl) {
  if (!confirm(t("confirmUpdate", deployTimeWarning(), agent.name))) return;

  btnEl.disabled = true;
  btnEl.textContent = t("processing");
  logEl.style.display = "block";
  logEl.textContent = t("runningUpdate");

  try {
    const res = await fetch(agentUrl(agent, "/update"), {
      method: "POST",
      headers: { "X-Agent-Token": agent.token },
    });
    const data = await res.json();
    if (!res.ok) {
      logEl.textContent = t("fail", data.error || res.status);
    } else if (data.ok === false) {
      // HTTP 200 tapi deploy DIBATALKAN sebelum sempat menyentuh
      // aplikasi POS (mis. git fetch gagal/timeout) - lihat _deploy_to
      // di ops/agent.py. Bukan error fatal, cuma belum kepakai.
      logEl.textContent = t("updateCancelled", data.log);
    } else {
      logEl.textContent =
        (data.changed
          ? t("updateDone", shortHash(data.before), shortHash(data.after))
          : t("alreadyLatest")) +
        "\n\n" + data.log;
    }
  } catch (e) {
    logEl.textContent = t("failContactAgent", e.message);
  }

  btnEl.disabled = false;
  btnEl.textContent = t("updateBtn");
  await refreshOne(agent.id);
}

async function toggleRollbackPanel(agent, card) {
  const panel = card.querySelector(".rollback-panel");

  if (panel.style.display !== "none") {
    panel.style.display = "none";
    return;
  }

  panel.style.display = "block";
  panel.innerHTML = `<div class="empty-state">${t("loadingCommits")}</div>`;

  try {
    const res = await fetch(agentUrl(agent, "/commits?limit=20"), {
      headers: { "X-Agent-Token": agent.token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    panel.innerHTML = data.commits.map(c => `
      <div class="discover-item rollback-item" data-hash="${c.hash}">
        <span>${c.hash === data.current ? `<span class="badge badge-ok" style="margin-right:6px;">${t("activeBadge")}</span>` : ''}${c.message}<br><span class="discover-item-ip">${shortHash(c.hash)} &middot; ${fmtDate(c.date)}</span></span>
      </div>
    `).join("");

    panel.querySelectorAll(".rollback-item").forEach(el => {
      if (el.dataset.hash === data.current) return; // sudah di sini, tidak perlu rollback ke diri sendiri
      el.addEventListener("click", () => {
        const logEl = card.querySelector(".log-box");
        const btnEl = card.querySelector(".rollback-toggle-btn");
        triggerRollback(agent, el.dataset.hash, logEl, btnEl, panel);
      });
    });
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">${t("failCommits", e.message)}</div>`;
  }
}

async function triggerRollback(agent, commitHash, logEl, btnEl, panel) {
  if (!confirm(t("confirmRollback", deployTimeWarning(), agent.name, shortHash(commitHash)))) return;

  panel.style.display = "none";
  btnEl.disabled = true;
  logEl.style.display = "block";
  logEl.textContent = t("runningRollback");

  try {
    const res = await fetch(agentUrl(agent, "/rollback"), {
      method: "POST",
      headers: { "X-Agent-Token": agent.token, "Content-Type": "application/json" },
      body: JSON.stringify({ commit: commitHash }),
    });
    const data = await res.json();
    if (!res.ok) {
      logEl.textContent = t("fail", data.error || res.status);
    } else if (data.ok === false) {
      logEl.textContent = t("rollbackCancelled", data.log);
    } else {
      logEl.textContent = t("rollbackDone", shortHash(data.before), shortHash(data.after), data.log);
    }
  } catch (e) {
    logEl.textContent = t("failContactAgent", e.message);
  }

  btnEl.disabled = false;
  await refreshOne(agent.id);
}

async function toggleLogsPanel(agent, card) {
  const panel = card.querySelector(".logs-panel");

  if (panel.style.display !== "none") {
    panel.style.display = "none";
    return;
  }

  panel.style.display = "block";
  panel.innerHTML = `<div class="empty-state">${t("loadingLogs")}</div>`;

  try {
    const res = await fetch(agentUrl(agent, "/logs?lines=150"), {
      headers: { "X-Agent-Token": agent.token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    if (!data.configured) {
      panel.innerHTML = `<div class="empty-state" style="white-space:pre-wrap; text-align:left;">${data.message}</div>`;
      return;
    }

    panel.innerHTML = `
      <div class="log-tail-label">stderr (${data.stderr_path || "-"})</div>
      <div class="log-tail">${(data.stderr || "").replace(/</g, "&lt;")}</div>
      <div class="log-tail-label">stdout (${data.stdout_path || "-"})</div>
      <div class="log-tail">${(data.stdout || "").replace(/</g, "&lt;")}</div>
    `;
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">${t("failLogs", e.message)}</div>`;
  }
}

async function toggleBackupsPanel(agent, card) {
  const panel = card.querySelector(".backups-panel");

  if (panel.style.display !== "none") {
    panel.style.display = "none";
    return;
  }

  panel.style.display = "block";
  panel.innerHTML = `<div class="empty-state">${t("loadingBackups")}</div>`;

  try {
    const res = await fetch(agentUrl(agent, "/backups"), {
      headers: { "X-Agent-Token": agent.token },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    if (!data.backups.length) {
      panel.innerHTML = `<div class="empty-state">${t("noBackups", data.folder)}</div>`;
      return;
    }

    panel.innerHTML = data.backups.map((b, i) => `
      <div class="backup-item" data-name="${b.name}" id="backup-${card.id}-${i}">
        <span>${b.name}<br><span class="discover-item-ip">${b.size_mb} MB &middot; ${fmtDate(b.modified)}</span></span>
        <button class="backup-verify-btn">${t("verifyBtn")}</button>
      </div>
    `).join("");

    panel.querySelectorAll(".backup-item").forEach(el => {
      const btn = el.querySelector(".backup-verify-btn");
      btn.addEventListener("click", () => verifyBackup(agent, el.dataset.name, el, btn));
    });
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">${t("failBackups", e.message)}</div>`;
  }
}

async function verifyBackup(agent, name, itemEl, btnEl) {
  btnEl.disabled = true;
  btnEl.textContent = t("verifying");

  let existing = itemEl.querySelector(".backup-verify-result");
  if (existing) existing.remove();

  try {
    const res = await fetch(agentUrl(agent, "/backups/verify"), {
      method: "POST",
      headers: { "X-Agent-Token": agent.token, "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    const resultEl = document.createElement("div");
    resultEl.className = `backup-verify-result ${data.ok ? "backup-verify-ok" : "backup-verify-bad"}`;
    resultEl.textContent = data.ok ? `✓ ${data.message}` : `✗ ${data.message || data.error}`;
    itemEl.appendChild(resultEl);
  } catch (e) {
    const resultEl = document.createElement("div");
    resultEl.className = "backup-verify-result backup-verify-bad";
    resultEl.textContent = t("fail", e.message);
    itemEl.appendChild(resultEl);
  }

  btnEl.disabled = false;
  btnEl.textContent = t("verifyBtn");
}

function statusBadge(cardEl, state) {
  const badge = cardEl && cardEl.querySelector(".status-badge");
  if (!badge) return;
  // "status-badge" WAJIB tetap ada di className - itu penanda yang
  // dipakai querySelector di atas buat menemukan elemen ini lagi di
  // panggilan berikutnya. Sempat hilang (bug lama): className diganti
  // total tanpa menyertakan "status-badge", jadi badge cuma bisa
  // terupdate SEKALI (saat render awal) lalu macet permanen di
  // "Mengecek..." walau data status sebenarnya berhasil dimuat.
  if (state === "loading") {
    badge.className = "badge badge-muted status-badge";
    badge.textContent = t("checkingBadge");
  } else if (state === "offline") {
    badge.className = "badge badge-danger status-badge";
    badge.textContent = t("offlineBadge");
  } else if (state === "uptodate") {
    badge.className = "badge badge-ok status-badge";
    badge.textContent = t("uptodateBadge");
  } else if (state === "outdated") {
    badge.className = "badge badge-warn status-badge";
    badge.textContent = t("outdatedBadge");
  }
}

function renderAgentCard(agent) {
  const card = document.createElement("div");
  card.className = "card";
  card.id = `agent-${agent.id}`;
  card.innerHTML = `
    <div class="agent-header">
      <div>
        <div class="agent-name">${agent.name}</div>
        <div class="agent-host">${agent.host}:${agent.port}</div>
      </div>
      <span class="badge badge-muted status-badge">${t("checkingBadge")}</span>
    </div>
    <div class="commit-body">
      <div class="empty-state">${t("loadingStatus")}</div>
    </div>
    <div class="action-groups">
      <div class="action-group">
        <div class="action-group-label">${t("deployGroup")}</div>
        <div class="actions">
          <button class="btn-primary update-btn">${t("updateBtn")}</button>
          <button class="btn-secondary rollback-toggle-btn">${t("rollbackBtn")}</button>
          <button class="btn-secondary logs-toggle-btn">${t("logBtn")}</button>
          <button class="btn-secondary backups-toggle-btn">${t("backupBtn")}</button>
        </div>
      </div>
      <div class="action-group">
        <div class="action-group-label">${t("manageGroup")}</div>
        <div class="actions">
          <button class="btn-secondary refresh-btn">${t("refreshBtn")}</button>
          <button class="btn-secondary edit-toggle-btn">${t("editBtn")}</button>
          <button class="btn-danger remove-btn">${t("removeBtn")}</button>
        </div>
      </div>
    </div>
    <div class="rollback-panel" style="display:none;"></div>
    <div class="logs-panel" style="display:none;"></div>
    <div class="backups-panel" style="display:none;"></div>
    <div class="edit-panel" style="display:none;"></div>
    <div class="log-box"></div>
  `;

  card.querySelector(".remove-btn").addEventListener("click", () => removeAgent(agent.id));
  card.querySelector(".refresh-btn").addEventListener("click", () => refreshOne(agent.id));
  card.querySelector(".edit-toggle-btn").addEventListener("click", () => toggleEditPanel(agent, card));
  card.querySelector(".update-btn").addEventListener("click", () => {
    const logEl = card.querySelector(".log-box");
    const btnEl = card.querySelector(".update-btn");
    triggerUpdate(agent, logEl, btnEl);
  });
  card.querySelector(".rollback-toggle-btn").addEventListener("click", () => {
    toggleRollbackPanel(agent, card);
  });
  card.querySelector(".logs-toggle-btn").addEventListener("click", () => {
    toggleLogsPanel(agent, card);
  });
  card.querySelector(".backups-toggle-btn").addEventListener("click", () => {
    toggleBackupsPanel(agent, card);
  });

  return card;
}

async function refreshOne(agentId) {
  const agents = await loadAgents();
  const agent = agents.find(a => a.id === agentId);
  if (!agent) return;

  const card = document.getElementById(`agent-${agent.id}`);
  if (!card) return;

  statusBadge(card, "loading");
  const body = card.querySelector(".commit-body");

  try {
    const data = await fetchStatus(agent);
    statusBadge(card, data.up_to_date ? "uptodate" : "outdated");

    let pendingHtml = "";
    if (data.pending_commits && data.pending_commits.length) {
      pendingHtml = `<div class="pending-list">` +
        data.pending_commits.map(c => `
          <div class="pending-item">
            <span class="pending-hash">${shortHash(c.hash)}</span> - ${c.message}
          </div>
        `).join("") +
        `</div>`;
    }

    body.innerHTML = `
      <div class="commit-row">
        <span class="commit-label">${t("runningLabel")}</span>
        <span class="commit-msg">${data.current.message}<br><span class="commit-hash">${shortHash(data.current.hash)} &middot; ${fmtDate(data.current.date)}</span></span>
      </div>
      <div class="commit-row">
        <span class="commit-label">${t("latestLabel")}</span>
        <span class="commit-msg">${data.latest.message}<br><span class="commit-hash">${shortHash(data.latest.hash)} &middot; ${fmtDate(data.latest.date)}</span></span>
      </div>
      <div class="commit-row">
        <span class="commit-label">${t("serviceLabel")}</span>
        <span class="commit-msg">${data.service_status || "-"}</span>
      </div>
      ${pendingHtml}
      <div class="checked-at">${t("checkedAt", fmtDate(data.checked_at))}</div>
    `;
  } catch (e) {
    statusBadge(card, "offline");
    body.innerHTML = `<div class="empty-state">${e.message}</div>`;
  }
}

async function refreshAll() {
  (await loadAgents()).forEach(a => refreshOne(a.id));
}

async function render() {
  const agents = await loadAgents();
  const list = document.getElementById("agentList");
  const empty = document.getElementById("emptyState");
  const count = document.getElementById("deviceCount");
  list.innerHTML = "";

  if (!agents.length) {
    empty.style.display = "block";
    count.textContent = "";
    return;
  }
  empty.style.display = "none";
  count.textContent = t("deviceCount", agents.length);

  agents.forEach(agent => {
    list.appendChild(renderAgentCard(agent));
  });
  refreshAll();
}

applyStaticI18n();
render();
// Auto-refresh tiap 60 detik.
setInterval(refreshAll, 60000);
</script>
